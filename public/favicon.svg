<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#12092e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7e14ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="100" height="100" rx="22" ry="22" fill="url(#bgGrad)" />
  <rect width="100" height="100" rx="22" ry="22" fill="none" stroke="#7e14ff" stroke-width="1" opacity="0.4" />

  <!-- N letter body -->
  <path d="M18 18 L18 82 L30 82 L30 40 L70 82 L82 82 L82 18 L70 18 L70 60 L30 18 Z"
        fill="url(#nGrad)" />

  <!-- Highlights -->
  <rect x="18" y="18" width="6" height="64" rx="1" fill="#a855f7" opacity="0.6" />
  <rect x="76" y="18" width="6" height="64" rx="1" fill="#a855f7" opacity="0.3" />
  <path d="M30 40 L70 82 L75 82 L35 40 Z" fill="#c084fc" opacity="0.25" />

  <!-- Cyan glow outline -->
  <path d="M18 18 L18 82 L30 82 L30 40 L70 82 L82 82 L82 18 L70 18 L70 60 L30 18 Z"
        fill="none" stroke="#47bfff" stroke-width="1.5" opacity="0.7" filter="url(#cyanGlow)" />

  <!-- Circuit corner nodes -->
  <circle cx="18" cy="18" r="2.5" fill="#47bfff" opacity="0.9" />
  <circle cx="82" cy="18" r="2.5" fill="#47bfff" opacity="0.9" />
  <circle cx="18" cy="82" r="2.5" fill="#47bfff" opacity="0.9" />
  <circle cx="82" cy="82" r="2.5" fill="#47bfff" opacity="0.9" />
  <circle cx="50" cy="50" r="2"   fill="#47bfff" opacity="0.6" />

  <!-- Corner circuit lines -->
  <line x1="18" y1="18" x2="8"  y2="18" stroke="#47bfff" stroke-width="1" opacity="0.4" />
  <line x1="18" y1="18" x2="18" y2="8"  stroke="#47bfff" stroke-width="1" opacity="0.4" />
  <line x1="82" y1="18" x2="92" y2="18" stroke="#47bfff" stroke-width="1" opacity="0.4" />
  <line x1="82" y1="18" x2="82" y2="8"  stroke="#47bfff" stroke-width="1" opacity="0.4" />
  <line x1="18" y1="82" x2="8"  y2="82" stroke="#47bfff" stroke-width="1" opacity="0.4" />
  <line x1="18" y1="82" x2="18" y2="92" stroke="#47bfff" stroke-width="1" opacity="0.4" />
  <line x1="82" y1="82" x2="92" y2="82" stroke="#47bfff" stroke-width="1" opacity="0.4" />
  <line x1="82" y1="82" x2="82" y2="92" stroke="#47bfff" stroke-width="1" opacity="0.4" />
</svg>